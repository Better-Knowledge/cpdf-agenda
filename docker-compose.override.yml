# Override específico deste VPS (better-knowledge): aqui quem faz TLS é o
# Traefik central (rede externa `web`), não o Caddy do compose base — o Caddy
# fica atrás do profile `manual` para não disputar as portas 80/443.
#
# O protótipo fica acessível em https://cpdf-agenda.better-knowledge.com
# (DNS A criado em 2026-08-22; certificado Let's Encrypt automático).
services:
  caddy:
    profiles: [manual]

  agenda-service:
    networks: [interna, web]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.cpdf-agenda.entrypoints=websecure"
      - "traefik.http.routers.cpdf-agenda.rule=Host(`cpdf-agenda.better-knowledge.com`)"
      - "traefik.http.routers.cpdf-agenda.service=cpdf-agenda"
      - "traefik.http.routers.cpdf-agenda.tls.certresolver=letsencrypt"
      - "traefik.http.services.cpdf-agenda.loadbalancer.server.port=8000"
      - "traefik.docker.network=web"

  # O canal segue fechado, com UMA exceção: drivers de nuvem (Telegram, Z-API)
  # só entregam inbound por HTTPS público. Exposto apenas /webhooks/canal/ —
  # /canal/* (envio, config, credenciais) continua inalcançável de fora.
  # O que protege esse caminho: token comparado com compare_digest antes de
  # qualquer efeito, e payload sem token válido responde 200 sem processar.
  canal-service:
    networks: [interna, evolution, web]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.cpdf-canal-webhook.entrypoints=websecure"
      - "traefik.http.routers.cpdf-canal-webhook.rule=Host(`cpdf-agenda.better-knowledge.com`) && PathPrefix(`/webhooks/canal/`)"
      - "traefik.http.routers.cpdf-canal-webhook.service=cpdf-canal-webhook"
      - "traefik.http.routers.cpdf-canal-webhook.tls.certresolver=letsencrypt"
      - "traefik.http.services.cpdf-canal-webhook.loadbalancer.server.port=8000"
      - "traefik.docker.network=web"

  web:
    networks: [interna, web]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.cpdf-agenda-ui.entrypoints=websecure"
      # PathPrefix é prefixo de string cru: /appointments também começa com
      # /app — por isso o casamento exige /app exato ou /app/…
      - "traefik.http.routers.cpdf-agenda-ui.rule=Host(`cpdf-agenda.better-knowledge.com`) && (Path(`/app`) || PathPrefix(`/app/`))"
      - "traefik.http.routers.cpdf-agenda-ui.service=cpdf-agenda-ui"
      - "traefik.http.routers.cpdf-agenda-ui.tls.certresolver=letsencrypt"
      - "traefik.http.services.cpdf-agenda-ui.loadbalancer.server.port=80"
      - "traefik.docker.network=web"

networks:
  web:
    external: true
