[project]
name = "agenda-service"
version = "0.1.0"
description = "Agenda Inteligente — módulo 02 do AS/IA Avançado"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.35",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "httpx>=0.27",
    "cryptography>=43",
    "scalar-fastapi>=1.0",
    "apscheduler>=3.10,<4",
    "pyjwt>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
ignore = ["B008"]  # Depends(...) em default de parâmetro é o idioma do FastAPI
